name: PR Title Check

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened

jobs:
  check-title:
    name: Check PR Title
    runs-on: ubuntu-latest
    concurrency:
      group: pr-title-check-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Validate PR title
        uses: actions/github-script@v7
        with:
          script: |
            if (context.payload.action === 'edited' && !context.payload.changes?.title) {
              core.info('Skip title check because only PR body changed.');
              return;
            }

            const pr = context.payload.pull_request;
            const title = pr.title;
            // Allow multi-type prefixes separated by "/" (e.g. "feat/fix"),
            // optional scope in parentheses, and both ASCII ":" and Chinese "：".
            const conventional = /^(feat|fix|docs|refactor|chore|style|test|ci|build|perf|revert)(\/[\w-]+)*(\([^)]+\))?[：:]\s*.+/;

            const tooShort = title.length < 5;
            const notConventional = !conventional.test(title);

            const MARKER = '<!-- pr-title-check-bot -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const markerComments = comments.filter(c => c.body && c.body.includes(MARKER));

            if (tooShort || notConventional) {
              const reasons = [];
              if (tooShort) reasons.push(`PR 标题过短（当前 ${title.length} 个字符，至少需要 5 个字符）`);
              if (notConventional) reasons.push('标题不符合提交规范（缺少合法类型前缀）');

              const body = [
                MARKER,
                '⚠️ **PR 标题不规范，请修改后重新提交。**',
                '',
                `**问题：** ${reasons.join('；')}`,
                '',
                '**格式要求：**',
                '- 标题长度不少于 5 个字符',
                '- 须以合法的类型前缀开头，支持单个或多个类型（用 `/` 分隔），格式为 `<type>[/type][scope]: <描述>`',
                '- 冒号支持半角 `:` 和全角 `：`',
                '',
                '**合法的类型前缀：**',
                '`feat` · `fix` · `docs` · `refactor` · `chore` · `style` · `test` · `ci` · `build` · `perf` · `revert`',
                '',
                '**示例：**',
                '```',
                'feat: 添加用户登录功能',
                'fix(auth): 修复 token 过期问题',
                'docs/chore: 更新 README 并整理依赖',
                'chore: 升级依赖版本',
                '```',
              ].join('\n');

              // Update one marker comment and remove other duplicates.
              const [existing, ...duplicates] = markerComments;

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body,
                });
              }

              for (const duplicate of duplicates) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: duplicate.id,
                });
              }

              core.setFailed(`PR 标题不规范：${reasons.join('；')}`);
              return;
            }

            // Title is valid now, remove previous warning comments.
            for (const markerComment of markerComments) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: markerComment.id,
              });
            }
