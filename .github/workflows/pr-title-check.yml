name: PR Title Check

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened

jobs:
  check-title:
    name: Check PR Title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Validate PR title
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            const conventional = /^(feat|fix|docs|refactor|chore|style|test|ci|build|perf|revert)(\([^)]+\))?: .+/;

            const tooShort = title.length < 5;
            const notConventional = !conventional.test(title);

            if (tooShort || notConventional) {
              const reasons = [];
              if (tooShort) reasons.push(`PR 标题过短（当前 ${title.length} 个字符，至少需要 5 个字符）`);
              if (notConventional) reasons.push('不符合 Conventional Commits 规范');

              const body = [
                '⚠️ **PR 标题不规范，请修改后重新提交。**',
                '',
                `**问题：** ${reasons.join('；')}`,
                '',
                '**格式要求：**',
                '- 标题长度不少于 5 个字符',
                '- 须以合法的类型前缀开头，格式为 `<type>[scope]: <描述>`',
                '',
                '**合法的类型前缀：**',
                '`feat` · `fix` · `docs` · `refactor` · `chore` · `style` · `test` · `ci` · `build` · `perf` · `revert`',
                '',
                '**示例：**',
                '```',
                'feat: 添加用户登录功能',
                'fix(auth): 修复 token 过期问题',
                'docs: 更新 README 文档',
                'chore: 升级依赖版本',
                '```',
              ].join('\n');

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });

              core.setFailed(`PR 标题不规范：${reasons.join('；')}`);
            }
