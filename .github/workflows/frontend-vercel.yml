name: Frontend Vercel Deploy

on:
  pull_request:
    branches:
      - main
    paths:
      - 'edu-ai-frontend/**'
      - '.github/workflows/frontend-vercel.yml'
  push:
    branches:
      - main
    paths:
      - 'edu-ai-frontend/**'
      - '.github/workflows/frontend-vercel.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Vercel deployment target.
        required: true
        default: production
        type: choice
        options:
          - production
          - preview

concurrency:
  group: frontend-vercel-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy frontend to Vercel
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      issues: write
      pull-requests: read
    defaults:
      run:
        working-directory: edu-ai-frontend
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Vercel secrets
        shell: bash
        run: |
          set -euo pipefail

          for required in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!required}" ]; then
              echo "::error title=Missing secret::$required is required for Vercel deployment."
              exit 1
            fi
          done

      - name: Deploy preview
        id: deploy-preview
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'preview') }}
        shell: bash
        run: |
          set -euo pipefail

          pnpm dlx vercel@latest pull --yes --environment=preview --token="$VERCEL_TOKEN"
          deploy_output="$(pnpm dlx vercel@latest deploy --yes --token="$VERCEL_TOKEN")"
          printf '%s\n' "$deploy_output"
          preview_url="$(printf '%s\n' "$deploy_output" | grep -Eo 'https://[^[:space:]]+\.vercel\.app[^[:space:]]*' | tail -n 1 || true)"
          if [ -z "$preview_url" ]; then
            echo "::error title=Missing Vercel preview URL::Vercel deploy output did not include a preview URL."
            exit 1
          fi
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "Preview deployment: $preview_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL
        if: ${{ github.event_name == 'pull_request' && steps.deploy-preview.outputs.preview_url != '' }}
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy-preview.outputs.preview_url }}
        with:
          script: |
            const marker = '<!-- vercel-preview-url -->';
            const previewUrl = process.env.PREVIEW_URL;
            const body = [
              marker,
              'Vercel Preview 已就绪：',
              '',
              previewUrl,
            ].join('\n');

            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }

      - name: Deploy production
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production') }}
        shell: bash
        run: |
          set -euo pipefail

          pnpm dlx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          production_url="$(pnpm dlx vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN")"
          echo "Production deployment: $production_url" >> "$GITHUB_STEP_SUMMARY"
